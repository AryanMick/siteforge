services:
  fixture-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    command: ["node", "scripts/fixture-gateway.mjs", "${SITEFORGE_JOB_ID:?Set SITEFORGE_JOB_ID to a completed fixture job ID}"]
    ports:
      - "127.0.0.1:${SITEFORGE_HOST_PORT:-4480}:4480"
    volumes:
      - type: bind
        source: ./.fixture-lab
        target: /work/.fixture-lab
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
